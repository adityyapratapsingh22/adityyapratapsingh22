<text x="156" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="17" font-weight="700" fill="#eef5ff">Deepfake Detection</text>
<text x="156" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="13" fill="#9fb0c4">Dual-branch classifier combining an</text>
<text x="156" y="97" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="13" fill="#9fb0c4">EfficientNet-B0 spatial branch with a</text>
