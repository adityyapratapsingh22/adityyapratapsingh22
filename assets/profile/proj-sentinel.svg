<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-labelledby="t d">
<title id="t">Sentinel</title><desc id="d">Animated card: explainable deepfake detection with a Grad-CAM heatmap and a dual-branch classifier.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f18"/><stop offset="1" stop-color="#0d1726"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a29"/><stop offset="1" stop-color="#0b131f"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#e8a33d"/></linearGradient>
<linearGradient id="sweepB" x1="0" x2="1"><stop offset="0" stop-color="#4aa8ff" stop-opacity="0"/><stop offset=".5" stop-color="#4aa8ff"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweepA" x1="0" x2="1"><stop offset="0" stop-color="#e8a33d" stop-opacity="0"/><stop offset=".5" stop-color="#e8a33d"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></linearGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#4aa8ff" stop-opacity=".30"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#e8a33d" stop-opacity=".20"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></radialGradient>
<radialGradient id="heat"><stop offset="0" stop-color="#e8a33d" stop-opacity=".95"/><stop offset=".55" stop-color="#e8663d" stop-opacity=".45"/><stop offset="1" stop-color="#e8663d" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4aa8ff" stroke-opacity=".06"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="9s" repeatCount="indefinite"/></pattern>
<clipPath id="frame"><rect width="900" height="392" rx="14"/></clipPath>
<linearGradient id="pname" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="296" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#eef5ff"/><stop offset=".4" stop-color="#eef5ff"/><stop offset=".5" stop-color="#4aa8ff"/><stop offset=".6" stop-color="#eef5ff"/><stop offset="1" stop-color="#eef5ff"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="260 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="face"><rect x="0" y="0" width="150" height="150" rx="10"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="900" height="392" fill="url(#bg)"/><rect width="900" height="392" fill="url(#grid)"/>
<circle cx="760" cy="150" r="260" fill="url(#glowB)" opacity=".7"><animate attributeName="cx" values="720;800;720" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="392" r="220" fill="url(#glowA)" opacity=".7"/>
<text x="36" y="46" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#e8a33d" letter-spacing="3">02 / PROJECT<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.222;1" dur="0.90s" fill="freeze"/></text>
<text x="36" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="38" font-weight="800" fill="url(#pname)">Sentinel<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.300;1" dur="1.00s" fill="freeze"/></text>
<text x="36" y="118" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#9fb0c4">Explainable deepfake detection · Individual project<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.417;1" dur="1.20s" fill="freeze"/></text>
<rect x="36" y="130" width="64" height="3" rx="1.5" fill="url(#ul)"><animate attributeName="width" values="0;0;64" keyTimes="0;.3;1" dur="1.2s" fill="freeze"/></rect>
<text x="36" y="164" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">Dual-branch deepfake detector (EfficientNet-B0 + 2D FFT)<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.500;1" dur="1.40s" fill="freeze"/></text>
<text x="36" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">for images and video. It pairs a spatial branch with a<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.539;1" dur="1.52s" fill="freeze"/></text>
<text x="36" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">frequency-domain branch, explains each prediction with<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.573;1" dur="1.64s" fill="freeze"/></text>
<text x="36" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">Grad-CAM, and ships with real authentication and per-<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.602;1" dur="1.76s" fill="freeze"/></text>
<text x="36" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">account scan history. Tested for cross-generator<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.628;1" dur="1.88s" fill="freeze"/></text>
<text x="36" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">generalisation: how it holds up on fakes from generators<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.650;1" dur="2.00s" fill="freeze"/></text>
<text x="36" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="14" fill="#d6e6f7" fill-opacity=".9">it was not trained on.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.670;1" dur="2.12s" fill="freeze"/></text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.650;1" dur="2.00s" fill="freeze"/><g transform="translate(36,330)"><rect width="68" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="46" lengthAdjust="spacing">PyTorch</text></g><g transform="translate(112,330)"><rect width="62" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="40" lengthAdjust="spacing">Python</text></g><g transform="translate(182,330)"><rect width="68" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="46" lengthAdjust="spacing">FastAPI</text></g><g transform="translate(258,330)"><rect width="55" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="33" lengthAdjust="spacing">React</text></g><g transform="translate(321,330)"><rect width="48" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="26" lengthAdjust="spacing">Vite</text></g><g transform="translate(36,362)"><rect width="121" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="99" lengthAdjust="spacing">Tailwind CSS v4</text></g><g transform="translate(165,362)"><rect width="62" height="24" rx="12.0" fill="#111a27" stroke="#e8a33d" stroke-opacity=".55"/><text x="11" y="16.0" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#d6e6f7" textLength="40" lengthAdjust="spacing">SQLite</text></g></g>
<g transform="translate(520,58)"><rect width="356" height="276" rx="14" fill="#0a1119" stroke="#1f3350"/><rect width="356" height="34" rx="14" fill="#0f1826"/><rect y="33" width="356" height="1" fill="#1f3350"/><circle cx="20" cy="17" r="4" fill="#3ddc97"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="32" y="21" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#9fb0c4" letter-spacing="1.5">SCAN · IMAGE / VIDEO</text><text x="340" y="21" text-anchor="end" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" fill="#e8a33d">GRAD-CAM</text><g transform="translate(24,58)"><g clip-path="url(#face)"><rect width="150" height="150" fill="#13263d"/><circle cx="75" cy="62" r="26" fill="#1f3d5f"/><path d="M26 150 q49 -64 98 0z" fill="#1f3d5f"/><circle cx="70" cy="62" r="34" fill="url(#heat)"><animate attributeName="r" values="26;40;26" dur="3.4s" repeatCount="indefinite"/><animate attributeName="cx" values="66;84;66" dur="5.2s" repeatCount="indefinite"/></circle><circle cx="100" cy="112" r="22" fill="url(#heat)" opacity=".8"><animate attributeName="r" values="16;28;16" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle><rect y="0" width="150" height="2" fill="#4aa8ff"><animate attributeName="y" values="0;148;0" dur="4s" repeatCount="indefinite"/></rect></g><rect width="150" height="150" rx="10" fill="none" stroke="#1f3350"/></g><text x="24" y="232" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" fill="#9fb0c4" letter-spacing="1.2">INPUT + HEATMAP</text><g transform="translate(206,62)"><rect width="130" height="38" rx="19" fill="#111a27" stroke="#4aa8ff" stroke-opacity=".6"/><text x="65" y="24" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#d6e6f7">EfficientNet-B0</text></g><g transform="translate(206,122)"><rect width="130" height="38" rx="19" fill="#111a27" stroke="#e8a33d" stroke-opacity=".6"/><text x="65" y="24" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#d6e6f7">2D FFT</text></g><path d="M174 100 L206 81" stroke="#4aa8ff" stroke-opacity=".5" fill="none" stroke-dasharray="3 3"/><path d="M174 130 L206 141" stroke="#e8a33d" stroke-opacity=".5" fill="none" stroke-dasharray="3 3"/><path d="M271 100 L271 122 M271 160 L271 192" stroke="#9fb0c4" stroke-opacity=".4" fill="none"/><circle r="3" fill="#4aa8ff" filter="url(#glow)"><animateMotion path="M174 100 L206 81 L271 81 L271 192" dur="3s" repeatCount="indefinite"/></circle><circle r="3" fill="#e8a33d" filter="url(#glow)"><animateMotion path="M174 130 L206 141 L271 141 L271 192" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle><g transform="translate(206,192)"><rect width="130" height="40" rx="20" fill="#111a27" stroke="#3ddc97" stroke-opacity=".6"><animate attributeName="stroke" values="#3ddc97;#3ddc97;#e8a33d;#e8a33d;#3ddc97" keyTimes="0;.45;.5;.95;1" dur="8s" repeatCount="indefinite"/></rect><text x="65" y="26" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#3ddc97">REAL<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="8s" repeatCount="indefinite"/></text><text x="65" y="26" text-anchor="middle" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#e8a33d" opacity="0">FAKE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.95;1" dur="8s" repeatCount="indefinite"/></text></g><text x="206" y="250" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="9.5" fill="#9fb0c4" letter-spacing="1.2">VERDICT + HISTORY</text></g>
