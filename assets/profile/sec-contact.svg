<text x="44" y="38" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#e8a33d" letter-spacing="1">08</text>
<rect x="76" y="18" width="1.5" height="28" fill="#1f3350"/>
<text x="92" y="42" font-family="'Segoe UI','Helvetica Neue',Arial,'Liberation Sans',sans-serif" font-size="26" font-weight="800" fill="url(#name)">Contact<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.111;1" dur="0.90s" fill="freeze"/></text>
<text x="868" y="38" text-anchor="end" font-family="'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#9fb0c4" fill-opacity=".75" letter-spacing="1.5">// say hello<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.385;1" dur="1.30s" fill="freeze"/></text>
