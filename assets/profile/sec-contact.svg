<rect x="0" y="62" width="220" height="2" fill="url(#sweepA)"><animateTransform attributeName="transform" type="translate" from="-220 0" to="900 0" dur="5s" begin="1.5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".75" y=".75" width="898.5" height="62.5" rx="13.5" fill="none" stroke="#1f3350" stroke-width="1.5"/>
